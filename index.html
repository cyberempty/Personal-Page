<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root {
    --bg: #000;
    --text: #f4f4f4;
    --muted: #a8a8a8;
    --glass: rgba(8,8,10,.52);
    --line: rgba(255,255,255,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    overflow-x: hidden;
  }

  /* ---------- Sfondo lava lamp ---------- */
  .lava {
    position: fixed; inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
    background: #000;
  }
  /* the filter merges bubbles only when they touch, then they separate again */
  .goo { position: absolute; inset: 0; filter: url(#goo); }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, #ffffff 0%, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 40% 36%, #f2f2f2 0%, #d2d2d2 38%, #9c9c9c 76%, #6a6a6a 100%);
    opacity: .92;
    will-change: transform;
    animation: wander var(--t, 48s) ease-in-out var(--d, 0s) infinite;
  }
  @keyframes wander {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    25%  { transform: translate3d(var(--x1), var(--y1), 0) scale(var(--s1)); }
    50%  { transform: translate3d(var(--x2), var(--y2), 0) scale(var(--s2)); }
    75%  { transform: translate3d(var(--x3), var(--y3), 0) scale(var(--s1)); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
  }

  /* ---------- Contenitore ---------- */
  .wrap {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 440px;
    padding: 36px 28px 30px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 28px;
    -webkit-backdrop-filter: blur(22px) saturate(110%);
    backdrop-filter: blur(22px) saturate(110%);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    animation: appear .9s ease both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Foto ---------- */
  .avatar {
    width: 124px; height: 124px;
    border-radius: 50%;
    object-fit: cover;
    background: #222;
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 0 0 6px rgba(255,255,255,.08), 0 0 34px rgba(255,255,255,.35);
    transition: box-shadow .4s ease, transform .4s ease;
  }
  .avatar:hover { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 46px rgba(255,255,255,.5); }

  h1 { margin-top: 20px; font-size: 1.9rem; font-weight: 600; letter-spacing: -.01em; }

  /* ---------- Link ---------- */
  .links { margin-top: 26px; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 2px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; padding: 0;
    background: none; border: 0; border-radius: 50%;
    cursor: pointer; text-decoration: none;
    transition: transform .25s ease, filter .25s ease;
  }
  .btn:hover, .btn:focus-visible { transform: scale(1.14); filter: brightness(1.12); outline: none; }
  .btn:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 40px; height: 40px; display: block; }

  /* ---------- Messaggio di conferma ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 5;
    transform: translate(-50%, 20px);
    padding: 10px 20px;
    background: rgba(255,255,255,.95); color: #000;
    border-radius: 999px;
    font-size: .9rem; font-weight: 500;
    opacity: 0; pointer-events: none;
  }
  .toast.show { animation: toast 2.2s ease forwards; }
  @keyframes toast {
    0%   { opacity: 0; transform: translate(-50%, 20px); }
    12%  { opacity: 1; transform: translate(-50%, 0); }
    80%  { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 10px); }
  }

  @media (max-width: 480px) {
    .card { padding: 30px 18px 24px; border-radius: 24px; }
    h1 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation-duration: 160s !important; }
    .card { animation: none; }
  }
</style>
</head>

<script>
/* Random bubbles: a new layout on every page load */
(function () {
  var box = document.querySelector('.goo');
  if (!box) return;
  var r = function (a, b) { return a + Math.random() * (b - a); };
  var cols = 5, rows = 4, html = '';
  for (var i = 0; i < cols; i++) {
    for (var j = 0; j < rows; j++) {
      if (Math.random() < 0.22) continue;               /* leave some cells empty */
      var size = Math.random() < 0.25 ? r(130, 230) : r(34, 120);
      var left = (i + r(0.1, 0.9)) / cols * 100;
      var top  = (j + r(0.1, 0.9)) / rows * 100;
      var t = r(34, 70);
      var st = 'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;' +
               'left:' + left.toFixed(1) + '%;top:' + top.toFixed(1) + '%;' +
               '--t:' + t.toFixed(0) + 's;--d:-' + r(0, t).toFixed(0) + 's;' +
               '--s1:' + r(.9, 1.1).toFixed(2) + ';--s2:' + r(.88, 1.12).toFixed(2) + ';';
      for (var k = 1; k <= 3; k++) {
        st += '--x' + k + ':' + r(-20, 20).toFixed(1) + 'vw;--y' + k + ':' + r(-45, 45).toFixed(1) + 'vh;';
      }
      html += '<span class="bubble" style="' + st + '"></span>';
    }
  }
  box.innerHTML = html;
})();
</script>
